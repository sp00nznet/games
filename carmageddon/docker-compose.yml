version: '3.8'

services:
  carmageddon:
    build: .
    container_name: carmageddon
    ports:
      - "8084:80"
    volumes:
      - ./game:/usr/share/nginx/html/game:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
