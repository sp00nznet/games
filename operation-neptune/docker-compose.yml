version: '3.8'

services:
  operation-neptune:
    build: .
    container_name: operation-neptune
    ports:
      - "8080:80"
    volumes:
      # Mount game files - place neptune.jsdos in ./game/ folder
      - ./game:/usr/share/nginx/html/game:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

