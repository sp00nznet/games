<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jagged Alliance - Self-Hosted DOS Game</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{background:#1a1a1a;color:#eee;font-family:sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}header{padding:20px;background:linear-gradient(135deg,#1a2a1a,#2a4a2a);width:100%;text-align:center}h1{color:#4a4;text-shadow:0 0 10px rgba(68,170,68,.5)}main{flex:1;padding:20px;width:100%;max-width:900px;display:flex;flex-direction:column;align-items:center}#dos-container{width:100%;max-width:800px;aspect-ratio:4/3;background:#000;border:3px solid #2a4a2a;border-radius:8px}#dos{width:100%;height:100%}.controls{margin-top:20px}button{background:#2a4a2a;color:#4a4;border:2px solid #4a4;padding:10px 20px;border-radius:5px;cursor:pointer;margin:5px}button:hover{background:#4a4;color:#1a1a1a}.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#4a4}.instructions{margin-top:30px;padding:20px;background:#1a2a1a;border-radius:8px;max-width:800px;width:100%}.instructions h2{color:#4a4;margin-bottom:15px}.instructions ul{list-style-position:inside;line-height:1.8}footer{padding:15px;background:#1a2a1a;width:100%;text-align:center;color:#666;font-size:.8em}footer a{color:#4a4}
    </style>
</head>
<body>
    <header><h1>Jagged Alliance</h1><p style="color:#aaa">Madlab Software / Sir-tech (1994)</p></header>
    <main>
        <div id="dos-container"><div id="dos"><div class="loading"><p>Loading...</p></div></div></div>
        <div class="controls"><button onclick="document.getElementById('dos-container').requestFullscreen()">Fullscreen</button><button onclick="location.reload()">Restart</button></div>
        <div class="instructions">
            <h2>Controls</h2>
            <ul>
                <li><strong>Mouse</strong> - Select units, navigate menus</li>
                <li><strong>Left Click</strong> - Move / Action</li>
                <li><strong>Right Click</strong> - Context menu</li>
                <li><strong>Esc</strong> - Cancel / Menu</li>
            </ul>
        </div>
    </main>
    <footer><p>Powered by <a href="https://js-dos.com/">js-dos</a> | Game from <a href="https://archive.org/details/msdos_Jagged_Alliance_1994">Internet Archive</a></p></footer>
    <script src="https://js-dos.com/v7/build/releases/latest/js-dos/js-dos.js"></script>
    <link rel="stylesheet" href="https://js-dos.com/v7/build/releases/latest/js-dos/js-dos.css">
    <script>Dos(document.getElementById("dos"),{url:"game/jagged.jsdos",autoStart:true}).catch(()=>{document.getElementById("dos").innerHTML="<div class='loading'><p style='color:#f66'>Game not found. Add jagged.jsdos to game/ folder.</p></div>"});</script>
</body>
</html>
