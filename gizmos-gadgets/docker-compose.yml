version: '3.8'

services:
  gizmos-gadgets:
    build: .
    container_name: gizmos-gadgets
    ports:
      - "8081:80"
    volumes:
      # Mount game files - place gizmos.jsdos in ./game/ folder
      - ./game:/usr/share/nginx/html/game:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
