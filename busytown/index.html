<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Richard Scarry's Busytown - Self-Hosted DOS Game</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{background:#fffaf0;color:#333;font-family:sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}header{padding:20px;background:linear-gradient(135deg,#ff6b6b,#ffa500);width:100%;text-align:center}h1{color:#fff;text-shadow:2px 2px 4px rgba(0,0,0,.3)}main{flex:1;padding:20px;width:100%;max-width:900px;display:flex;flex-direction:column;align-items:center}#dos-container{width:100%;max-width:800px;aspect-ratio:4/3;background:#000;border:4px solid #ffa500;border-radius:12px}#dos{width:100%;height:100%}.controls{margin-top:20px}button{background:#ff6b6b;color:#fff;border:none;padding:12px 24px;border-radius:25px;cursor:pointer;margin:5px;font-weight:bold}button:hover{background:#ff8c8c;transform:scale(1.05)}.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#ff6b6b}.instructions{margin-top:30px;padding:20px;background:#fff;border:3px solid #ffa500;border-radius:12px;max-width:800px;width:100%}.instructions h2{color:#ff6b6b;margin-bottom:15px}.instructions ul{list-style-position:inside;line-height:1.8;color:#555}footer{padding:15px;background:#ff6b6b;width:100%;text-align:center;color:#fff;font-size:.8em}footer a{color:#fff}
    </style>
</head>
<body>
    <header><h1>Richard Scarry's Busytown</h1><p style="color:#fff">Educational Fun for Kids!</p></header>
    <main>
        <div id="dos-container"><div id="dos"><div class="loading"><p>Loading...</p></div></div></div>
        <div class="controls"><button onclick="document.getElementById('dos-container').requestFullscreen()">Fullscreen</button><button onclick="location.reload()">Restart</button></div>
        <div class="instructions">
            <h2>How to Play</h2>
            <ul>
                <li><strong>Mouse</strong> - Click to interact with characters and objects</li>
                <li><strong>Arrow Keys</strong> - Navigate menus</li>
                <li><strong>Enter</strong> - Confirm selection</li>
                <li><strong>Esc</strong> - Return to menu</li>
            </ul>
        </div>
    </main>
    <footer><p>Powered by <a href="https://js-dos.com/">js-dos</a> | Game from <a href="https://archive.org/details/busytown_dos">Internet Archive</a></p></footer>
    <script src="https://js-dos.com/v7/build/releases/latest/js-dos/js-dos.js"></script>
    <link rel="stylesheet" href="https://js-dos.com/v7/build/releases/latest/js-dos/js-dos.css">
    <script>Dos(document.getElementById("dos"),{url:"game/busytown.jsdos",autoStart:true}).catch(()=>{document.getElementById("dos").innerHTML="<div class='loading'><p style='color:#f66'>Game not found. Add busytown.jsdos to game/ folder.</p></div>"});</script>
</body>
</html>
